<html>
<head>
<title>AEP InetArchiv</title>
    
    <script type="text/javascript" src="js/jquery-1.7.1.min.js"></script>
    <script type="text/javascript" src="ui/jquery.ui.core.js"></script> 
    <script type="text/javascript" src="ui/jquery.ui.widget.js"></script>
    <script type="text/javascript" src="ui/jquery.ui.datepicker.js"></script>
    <script type="text/javascript" src="ui/i18n/jquery.ui.datepicker-de.js"></script>
    <script type="text/javascript" src="js/jquery.fixedheadertable.js"></script>
    <script type="text/javascript" src="js/inet.js"></script>
 
<style>

html, body{ margin: 0px; padding: 0em;}

.navsystem {background: #E41F29;width: 100%; height: 45px; margin-top: 0px;}
.navsystem ul {list-style-type: none; position: relative; right: 22px;}
.navsystem ul li {float: right; margin: 15px 0px 0px 15px;}
.navsystem ul li a {text-decoration: none;}

.logoheader { width: 100%;}
.logoheader .img-logo {background: url("image/inet-logo-aep-direkt.png") left top no-repeat;width: 313px;height: 46px;margin: 20px 0px 0px 5px;}

#wrapper {position:relative; margin:0 auto; width:1024px;}
#wrapper form {padding-bottom:30px; margin: 50px 250px; background: #E41F29; border-radius: 0.2em 0.2em 0.2em;}
#wrapper form table{border-collapse: collapse; border-spacing: 0; margin: 30px 0px 0px 110px; border-radius: 0.2em 0.2em 0.2em 0.2em;}
#wrapper form table .header{ padding: 30px 0px; font-family: Arial; font-style: normal; font-weight: bold; font-size: 15px; color: white; }
#wrapper form table label {
    color: white; margin-right: 10px;
    font-family: Arial; font-style: normal; font-weight: bold; font-size: 13px; color: white;}
#wrapper form table input{ width: 100%; border:0; padding:0; height:22px; line-height: 22px;}
#wrapper form table input.button{
    padding: 0px 5px; margin-top: 3px; 
    cursor: pointer; background: #404040; border-radius: 0.2em 0.2em 0.2em 0.2em;
    font-family: Arial; font-style: normal; font-weight: bold; font-size: 13px; color: white;
}

.feedbackPanelERROR {color: red; list-style-type: none; margin-left: 125px; }
.feedbackPanel{ padding: 0;}
.feedbackPanel ul{ padding: 0; list-style-type: none; }

</style>

<script type="text/javascript">
    $(document).ready(function() {
        $("#tbluserform").delegate("input", "keypress", function(e) {
            if (e.originalEvent.keyCode == 13) {
                e.preventDefault();
            }
        });
    });
</script>

</head>

<body onload="">
<div class="navsystem"></div>
<div class="logoheader"><div class="img-logo"></div></div>
<div id="wrapper"> 
    <form id="tbluserform" wicket:id="userForm">
        <table>
            <tr>
                <th class="header" colspan="3">Passwort ändern</th>
            </tr>
            <tr>
                <td><label>Neues Passwort: </label></td>
                <td colspan="2"><input wicket:id="Passwort1" type="password" size="20" autocomplete="new-password"/></td>
            </tr>
            <tr>
                <td><label>Passwort wiederholen:</label></td>
                <td colspan="2"><input wicket:id="Passwort2" type="password" size="20" autocomplete="new-password"/></td>
            </tr>
            <tr>
                <td></td>
                <td><input class="button" type="submit" wicket:id="cancelbutton" value="Abbrechen" /></td>
                <td><input class="button" type="submit" wicket:id="btnConfirm" value="OK"/></td>   
            </tr>
        </table>
    </form>
    <div wicket:id="feedback"></div>
</div>
</body>
</html>
