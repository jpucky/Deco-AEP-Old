<?xml version="1.0" encoding="utf-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:wicket="http://wicket.apache.org">
<head>
</head>
<body>
    <wicket:panel>

        <div class="view">

            <a wicket:id="refresh">
                <img src="image/refresh.png" alt="Seite neu laden" title="Refresh"/>
            </a>

            <table class="fixedHeaderTbl" cellpadding="0" cellspacing="0">
                <thead>
                    <tr>
                        <th wicket:id="obylogin">Login</th>
                        <th wicket:id="obyvorname">Vorname</th>
                        <th wicket:id="obynachname">Nachname</th>
                        <th wicket:id="obysession">Sessionid</th>
                        <th wicket:id="obydatesince">Angemeldet seit</th>
                        <th wicket:id="obyipadress">IP-Adresse</th>
                    </tr>
                </thead>
            
                <tbody>
                    <tr wicket:id=userliste>
                        <td wicket:id="login">[login]</td>
                        <td wicket:id="vorname">[login]</td>
                        <td wicket:id="nachname">[login]</td>
                        <td wicket:id="sessionid">[sessionid]</td>
                        <td wicket:id="loginsince">[loginsince]</td>
                        <td wicket:id="ipadress">[ipadress]</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </wicket:panel>
</body>
</html>
