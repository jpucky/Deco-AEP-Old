<body>

        <div class="view halde">
            <!--

               <a class="download" wicket:id="downloadOffeneScan">Download</a>
                <a wicket:id="refreshOffeneScan" class="refresh">
                    <img src="image/refresh.png" alt="Seite neu laden" title="Ansicht aktualisieren"/>
                </a>
                <div class="info">
                   <span wicket:id="scancnt">[1234]</span> offene Scandateien <span wicket:id="scandate">[date]</span>

                    <p class="border-notch-left notchleft"></p>

                <a class="download" wicket:id="downloadOffeneArchivierung">Download</a>     
                <a wicket:id="refreshOffeneArchivierung" class="refresh">
                    <img src="image/refresh.png" alt="Seite neu laden" title="Ansicht aktualisieren"/>
                </a> 
                <div class="info"><span wicket:id="oacnt">[1234]</span> offene Archivierungsdatensätze <span wicket:id="oadate">[date]</span></div>
