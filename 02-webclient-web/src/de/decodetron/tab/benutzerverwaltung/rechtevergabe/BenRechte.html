    <wicket:panel xmlns:wicket="http://wicket.apache.org">

            <form action="forms.html" method="post" class="search searchForm1" wicket:id="viewFilter">

                    </div>
                    <input type="submit" value="SUCHE STARTEN" class="search" wicket:id="start-search"/>

            <table class="changeduser" wicket:id="dummycontainer">

                    <th>Geänderte Benutzer</th>
                    <th>Gruppenbezeichner</th>
                </tr>
    
                <tr wicket:id="changeduserlist">
                    <td wicket:id="login">[login]</td>

                </tr>
            </table>
